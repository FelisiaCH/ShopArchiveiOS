# The iOS app on macOS. `xcodegen generate` (in this folder) makes ShopArchive.xcodeproj, which is not committed; on Linux, xtool.yml builds the same app.
# The shared code is built by Gradle (:clientcore) as a static framework, ClientCore, into Frameworks/ (CI does it; fetch-clientcore.sh downloads that), where Package.swift looks too.
name: ShopArchive
options:
  bundleIdPrefix: xyz.felismp
  developmentLanguage: en
  deploymentTarget:
    iOS: "16.0"
# The version numbers, generated from ShopArchive's gradle.properties by :generateIosResources.
configFiles:
  Debug: Version.xcconfig
  Release: Version.xcconfig
settings:
  base:
    SWIFT_VERSION: "5.0"
    # Kotlin/Native has no x86_64 simulator target; the simulator on an Apple-silicon Mac is arm64.
    ARCHS: arm64
targets:
  ShopArchive:
    type: application
    platform: iOS
    sources:
      - ShopArchive
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: xyz.felismp.shoparchive
        # The app's own keys are in AppInfo.plist, shared with xtool; Xcode adds the standard ones.
        INFOPLIST_FILE: AppInfo.plist
        GENERATE_INFOPLIST_FILE: YES
        TARGETED_DEVICE_FAMILY: "1"
        # The icon is in ShopArchive/Assets.xcassets; xtool cannot compile it, so CI does and fetch-clientcore.sh downloads Assets.car.
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    dependencies:
      # A static framework: linked into the app, not embedded.
      - framework: Frameworks/ClientCore.xcframework
        embed: false
